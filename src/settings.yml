---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.3.1
serverless_language: node
refresh_interval_floor: ''
polling_url: https://raw.githubusercontent.com/michaelkurath/TRMNL-BUILT/main/data/trmnl.json
polling_headers: ''
polling_body: ''
id: 543792
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About BUILT
  category: custom,education
  description: An illustrated exhibit about the engineering decisions behind completed landmarks and infrastructure.
  github_url: https://github.com/michaelkurath/TRMNL-BUILT
- keyname: display_edition
  name: Display edition
  field_type: select
  options:
  - Automatic: auto
  - Classic: classic
  - Frame: frame
  default: auto
  conditional_validation:
  - when: auto
    visible: [exhibit_ids]
  - when: classic
    visible: [exhibit_ids]
  - when: frame
    visible: [frame_exhibit_ids]
  description: Automatic uses the gallery on TRMNL Frame. The other options override the full-screen layout.
  optional: true
- keyname: exhibit_mode
  name: Exhibit rotation
  field_type: select
  options:
  - Full Collection: all
  - My Selection: selected
  default: all
  description: My Selection uses your chosen exhibits.
  optional: true
- keyname: exhibit_ids
  name: My exhibits
  field_type: string
  description: '<a href="https://michaelkurath.github.io/Never-Built/picker.html?recipe=TRMNL-BUILT">Choose exhibits</a>, then paste your selection here.'
  optional: true
- keyname: frame_exhibit_ids
  name: My Frame exhibits
  field_type: string
  description: '<a href="https://michaelkurath.github.io/Never-Built/picker.html?recipe=TRMNL-BUILT&amp;edition=frame">Choose Frame artwork</a>, then paste your selection here.'
  optional: true
- keyname: frame_caption
  name: Frame presentation
  field_type: select
  options:
  - Artwork only: artwork
  - Caption overlay: overlay
  default: artwork
  description: Add a short exhibit label in the upper-right corner.
  optional: true
- keyname: frame_show_title
  name: Show title in Artwork only
  field_type: boolean
  default: false
  description: Add the exhibit title in Artwork only mode.
  optional: true
name: BUILT
description: What it took to make it real.
refresh_interval: 15
